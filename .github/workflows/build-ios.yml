name: Build CardboardXR for iOS

on:
  workflow_dispatch:

jobs:
  export-xcode:
    name: Export Xcode Project
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-6000.6.0f1-ios-3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Export Xcode Project via Unity CLI
        run: |
          mkdir -p build/iOS
          unity-editor \
            -batchmode \
            -nographics \
            -quit \
            -username "${{ secrets.UNITY_USERNAME }}" \
            -password "${{ secrets.UNITY_PASSWORD }}" \
            -projectPath "$GITHUB_WORKSPACE" \
            -buildTarget iOS \
            -executeMethod UnityEditor.BuildPipeline.BuildPlayer \
            -logFile /dev/stdout || true

          # Run brenpoly's build or standard iOS export
          unity-editor \
            -batchmode \
            -nographics \
            -quit \
            -username "${{ secrets.UNITY_USERNAME }}" \
            -password "${{ secrets.UNITY_PASSWORD }}" \
            -projectPath "$GITHUB_WORKSPACE" \
            -buildTarget iOS \
            -customBuildPath "$GITHUB_WORKSPACE/build/iOS" \
            -logFile /dev/stdout

      - name: Upload Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XcodeProject
          path: build/iOS

  package-ipa:
    name: Compile Unsigned IPA
    needs: export-xcode
    runs-on: macos-latest
    steps:
      - name: Download Xcode Project
        uses: actions/download-artifact@v4
        with:
          name: XcodeProject
          path: XcodeProject

      - name: Build Unsigned App & Package IPA
        run: |
          cd XcodeProject
          xcodebuild -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r CardboardXR.ipa Payload

      - name: Upload Final IPA
        uses: actions/upload-artifact@v4
        with:
          name: CardboardXR-iOS
          path: XcodeProject/CardboardXR.ipa

